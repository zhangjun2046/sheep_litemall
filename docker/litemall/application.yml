spring:
  profiles:
    active: none
  message:
    encoding: UTF-8
  datasource:
    druid:
      url:  jdbc:mysql://mysql:3306/litemall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&verifyServerCertificate=false&useSSL=true
      driver-class-name:  com.mysql.cj.jdbc.Driver
      username:  litemall
      password:  litemall123456
      initial-size:  10
      max-active:  50
      min-idle:  10
      max-wait:  60000
      pool-prepared-statements:  true
      max-pool-prepared-statement-per-connection-size:  20
      validation-query:  SELECT 1 FROM DUAL
      test-on-borrow:  false
      test-on-return:  false
      test-while-idle:  true
      time-between-eviction-runs-millis:  60000
      filters:  stat,wall

server:
  port: 8080

logging:
  config: classpath:logback-spring.xml

pagehelper:
  helperDialect:  mysql
  reasonable: true
  supportMethodsArguments:  true
  params: count=countSql

litemall:
  # 开发者应该设置成自己的wx相关信息
  wx:
    app-id: wxa5b486c6b918ecfb
    app-secret: e04004829d4c383b4db7769d88dfbca1
    mch-id: 111111
    mch-key: xxxxxx
    notify-url: http://122.51.199.160:8080/wx/order/pay-notify
    # 商户证书文件路径
    # 请参考“商户证书”一节 https://pay.weixin.qq.com/wiki/doc/api/wxa/wxa_api.php?chapter=4_3
    key-path: xxxxx

  auth:
    admin-session-timeout-hours: 24
    wx-token-expire-hours: 48

  license:
    expire-year: "2028"

  #通知相关配置
  notify:
    mail:
      # 邮件通知配置,邮箱一般用于接收业务通知例如收到新的订单，sendto 定义邮件接收者，通常为商城运营人员
      enable: false
      host: smtp.exmail.qq.com
      username: ex@ex.com.cn
      password: XXXXXXXXXXXXX
      sendfrom: ex@ex.com.cn
      sendto: ex@qq.com
      port: 465

    # 短消息模版通知配置（name 对应 NotifyType）
    sms:
      enable: false
      active: tencent
      sign: 待补充
      operator-mobiles: 待补充
      template:
        - name: newOrder
          templateId: 待补充
        - name: ship
          templateId: 待补充
        - name: refundApply
          templateId: 待补充
        - name: refund
          templateId: 待补充
      tencent:
        appid: 待补充
        appkey: 待补充
      aliyun:
        regionId: xxx
        accessKeyId: xxx
        accessKeySecret: xxx

  # 快鸟物流查询配置
  express:
    enable: false
    appId: "XXXXXXXXX"
    appKey: "XXXXXXXXXXXXXXXXXXXXXXXXX"
    vendors:
      - code: "SF"
        name: "顺丰速运"

  # 阿里云市场物流查询，本期只查顺丰
  wuliu:
    host: https://wuliu.market.alicloudapi.com
    path: /kdi
    appcode: a51e7525bf0d47bcb0d8d220e5841861
    sf-type: SFEXPRESS
    sf-vendor-code: SF

  # 对象存储配置
  storage:
    # 当前工作的对象存储模式，分别是local、aliyun、tencent
    active: local
    # 本地对象存储配置信息
    local:
      storagePath: storage
      address: http://122.51.199.160:8080/wx/storage/fetch/
    # 阿里云对象存储配置信息
    aliyun:
      endpoint: oss-cn-shenzhen.aliyuncs.com
      accessKeyId: 111111
      accessKeySecret: xxxxxx
      bucketName: xxxxxx
    # 腾讯对象存储配置信息
    # 请参考 https://cloud.tencent.com/document/product/436/6249
    tencent:
      secretId: 111111
      secretKey: xxxxxx
      region: xxxxxx
      bucketName: xxxxxx
    # 七牛云对象存储配置信息
    qiniu:
      endpoint: http://pd5cb6ulu.bkt.clouddn.com
      accessKey: 111111
      secretKey: xxxxxx
      bucketName: litemall

swagger:
  production: true